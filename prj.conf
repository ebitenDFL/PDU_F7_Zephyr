# Milestone 2: compile-only CANopen node; power outputs remain inactive.
CONFIG_GPIO=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048

# CAN1/CANopen communication only. No persistent storage or program download
# is enabled until the 256 KiB flash sector layout and MCUboot fit are proven.
CONFIG_CAN=y
CONFIG_CAN_DEFAULT_BITRATE=500000
CONFIG_CANOPENNODE=y
CONFIG_CANOPEN_NODE_ID=10
CONFIG_CANOPENNODE_STORAGE=n
CONFIG_CANOPENNODE_LEDS=n
CONFIG_CANOPENNODE_SYNC_THREAD=y
CONFIG_CANOPENNODE_SYNC_THREAD_PERIOD_US=1000
CONFIG_CANOPENNODE_PROGRAM_DOWNLOAD=n

# No console, SPI, flash writes, or output-control engine yet.
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_SPI=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_NVS=n
