# Build MCUboot and propagate overwrite-only mode to the application.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Bench-only signature verification. This is MCUboot's published development
# key, suitable for exercising the complete signed update path but not for a
# production release.
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/home/dfl/zephyrproject/bootloader/mcuboot/root-rsa-2048.pem"
