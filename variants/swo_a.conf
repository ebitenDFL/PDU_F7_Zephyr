CONFIG_PDU_IMAGE_VARIANT_A=y
CONFIG_PDU_SWO_DEBUG=y

# Temporary non-production diagnostics through PB3/ITM SWO. The normal A/B
# build configurations remain unchanged and have logging disabled.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_SWO=y
CONFIG_LOG_BACKEND_SWO_PROTOCOL_NRZ=y
CONFIG_LOG_BACKEND_SWO_REF_FREQ_HZ=216000000
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=2000000
CONFIG_LOG_BACKEND_SWO_SYNC_PACKETS=n
CONFIG_LOG_BACKEND_UART=n

# The CANopen TX worker defaults to 512 bytes. Formatted error logging from
# that worker needs substantially more stack in this instrumentation build.
CONFIG_CANOPENNODE_TX_WORKQUEUE_STACK_SIZE=1536
